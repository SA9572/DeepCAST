# Render deployment configuration for DeepCSAT
services:
  - type: web
    name: deepcsat-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python DeepCSAT_Deployment.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    autoDeploy: true
